<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хронолента — конструктор временных линий</title>

<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel2: #222831;
    --line: #2e3641;
    --text: #e4e8ee;
    --dim: #98a2b0;
    --accent: #d09a52;
    --danger: #b5563f;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Три блока: редактор слева во всю высоту, панель настроек и кадр справа.
     Сеткой, а не вложенностью, — чтобы на телефоне те же три блока можно
     было переставить в колонку и приклеить кадр к верху экрана. */
  #app {
    display: grid; height: 100vh; overflow: hidden;
    grid-template-columns: 400px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  #side { grid-column: 1; grid-row: 1 / 3; }
  #bar  { grid-column: 2; grid-row: 1; }
  #view { grid-column: 2; grid-row: 2; }

  /* ---------- левая панель ---------- */
  #side {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--line);
  }

  #brand {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  #brand b { font-size: 16px; letter-spacing: .02em; }
  #brand span { color: var(--dim); font-size: 12px; }

  .scroll { overflow-y: auto; flex: 1; padding: 14px 16px 40px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }

  input, select, textarea, button {
    font: inherit; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button { cursor: pointer; width: auto; }
  button:hover { border-color: #46515f; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }
  button.small { padding: 4px 8px; font-size: 12px; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .row.tight { gap: 6px; }

  h3 {
    margin: 22px 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .12em; color: var(--dim); font-weight: 600;
  }
  h3:first-child { margin-top: 0; }

  /* ---------- список событий ---------- */
  #events { display: flex; flex-direction: column; gap: 8px; }

  .ev {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px; cursor: pointer;
  }
  .ev.sel { border-color: var(--accent); }
  .ev-top { display: flex; align-items: center; gap: 8px; }
  .ev-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ev-when { font-size: 12px; color: var(--dim); flex: none; }
  .ev-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-body { margin-top: 8px; display: none; }
  .ev.sel .ev-body { display: block; }
  .ev-actions { display: flex; gap: 6px; margin-top: 8px; }

  .hint { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.45; }
  .warn { color: var(--accent); }

  .made {
    margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.55; color: var(--dim);
  }
  .made a { color: var(--accent); }

  /* ---------- правая часть ---------- */
  #bar {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel);
  }
  #bar .sp { flex: 1; }
  #bar label { font-size: 12px; color: var(--dim); flex: none; }
  #bar select, #bar input { width: auto; }
  #bar .group { display: flex; align-items: center; gap: 6px; }
  #bar .acts { display: flex; align-items: center; gap: 8px; }

  /* Кадр и ползунок шагов живут вместе: на телефоне этот блок прилипает
     к верху экрана, чтобы правка события была видна сразу. */
  #view { display: flex; flex-direction: column; min-height: 0; }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: auto; background: #0e1114;
  }
  #cv { max-width: 100%; max-height: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.55); }

  #steps {
    padding: 10px 16px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  #steps input[type=range] { flex: 1; padding: 0; background: none; border: none; }
  #stepLabel { font-size: 12px; color: var(--dim); min-width: 130px; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--accent);
    padding: 10px 16px; border-radius: var(--radius);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 70vw;
  }
  #toast.on { opacity: 1; }

  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }

  /* ---------- узкий экран ----------------------------------------------
     На телефоне две колонки не помещаются, поэтому кадр и редактор встают
     друг под друга. Кадр прилипает к верху: правишь событие внизу списка —
     и сразу видишь, что получилось, без прокрутки туда-обратно.          */

  @media (max-width: 900px) {
    html, body { height: auto; }

    /* Кадр наверху и прилипший, под ним — кнопки, настройки и редактор.
       Прилипает он ко всей странице, поэтому виден и в конце списка событий. */
    #app {
      display: flex; flex-direction: column;
      height: auto; overflow: visible;
    }
    #view {
      order: 1;
      position: sticky; top: 0; z-index: 3;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    #bar { order: 2; border-bottom: none; }
    #side { order: 3; border-right: none; border-top: 1px solid var(--line); }
    .scroll { overflow: visible; flex: none; padding-bottom: 60px; }

    #stage { flex: none; height: 30vh; min-height: 170px; padding: 10px; }

    #bar { padding: 10px 12px; gap: 8px 10px; }
    #bar .sp { display: none; }
    #bar select { flex: 1; min-width: 0; }
    /* min-width: 0 — иначе длинный пункт списка распирает пару и она
       перестаёт помещаться вдвоём в строку */
    #bar .group { flex: 1 1 45%; min-width: 0; }
    #bar .acts { order: -1; width: 100%; gap: 6px; }
    #bar .acts button { flex: 1; padding: 8px 4px; }

    #steps { padding: 8px 12px; gap: 8px; }
    #stepLabel { min-width: 0; white-space: nowrap; }
    #playAll { white-space: nowrap; }

    #brand { padding: 12px; }
    #toast { max-width: 88vw; bottom: 16px; }

    /* Браузер подтягивает поле в фокусе к верху экрана — а там прилипший
       кадр. Оставляем ему место, иначе поле окажется под картинкой. */
    .field input, .field textarea, .ev { scroll-margin-top: calc(30vh + 70px); }

    /* 16px — иначе Safari на айфоне зумит страницу при фокусе в поле */
    input, select, textarea { font-size: 16px; padding: 9px 10px; }
    button { font-size: 14px; }
  }

  @media (max-width: 560px) {
    #stage { height: 26vh; min-height: 150px; }
    .field input, .field textarea, .ev { scroll-margin-top: calc(26vh + 70px); }
    #brand span { display: none; }
    .row { flex-direction: column; gap: 8px; }
    .ev-actions button { padding: 6px 4px; }
  }
</style>

<div id="app">
  <aside id="side">
    <div id="brand"><b>Хронолента</b> <span>конструктор временных линий</span></div>

    <div class="scroll">
      <h3>Проект</h3>
      <div class="field">
        <label>Заголовок</label>
        <input id="pTitle" placeholder="Например: Экспедиция Франклина">
      </div>
      <div class="field">
        <label>Подзаголовок</label>
        <input id="pSub" placeholder="необязательно">
      </div>
      <div class="field">
        <label>Подпись внизу</label>
        <input id="pFoot" placeholder="имя канала, школы, автора">
      </div>

      <h3>События</h3>
      <div id="events"></div>
      <div class="row" style="margin-top:10px">
        <button id="addEv" class="primary">Добавить событие</button>
        <button id="sortEv" class="ghost">Упорядочить</button>
      </div>
      <div class="hint" id="scaleHint"></div>

      <div class="made">
        Хронолента выросла из работы над каналом
        <a href="https://mihailgimmelman90-ctrl.github.io/oshibka-na-karte/"
           target="_blank" rel="noopener">«Ошибка на карте»</a> —
        одна история на выпуск: один корабль, одна экспедиция, одна ночь.
        Там же карта всех выпусков.
      </div>
    </div>
  </aside>

  <div id="bar">
      <span class="group">
        <label for="orient">Вид</label>
        <select id="orient">
          <option value="h">Горизонтальная</option>
          <option value="v">Вертикальная</option>
        </select>
      </span>

      <span class="group">
        <label for="size">Размер</label>
        <select id="size">
          <option value="2560x1440">2560×1440 (16:9)</option>
          <option value="1920x1080">1920×1080 (16:9)</option>
          <option value="1080x1920">1080×1920 (9:16)</option>
          <option value="1080x1080">1080×1080 (1:1)</option>
        </select>
      </span>

      <span class="group">
        <label for="theme">Тема</label>
        <select id="theme"></select>
      </span>

      <span class="group">
        <label for="scale">Шкала</label>
        <select id="scale">
          <option value="equal">Равные промежутки</option>
          <option value="time">По реальному времени</option>
          <option value="timebreak">По времени, с разрывами</option>
        </select>
      </span>

      <span class="sp"></span>

      <span class="acts">
        <button id="save" class="ghost">Сохранить</button>
        <button id="load" class="ghost">Открыть</button>
        <button id="exportOne" class="ghost">Кадр</button>
        <button id="exportAll" class="primary">Экспорт кадров</button>
      </span>
      <input id="file" type="file" accept="application/json" hidden>
  </div>

  <div id="view">
    <div id="stage"><canvas id="cv"></canvas></div>

    <div id="steps">
      <span id="stepLabel"></span>
      <input id="step" type="range" min="0" max="0" value="0">
      <button id="playAll" class="small ghost">Показать всё</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ============================================================
   Хронолента — конструктор временных линий.
   Один файл, работает офлайн, ничего не отправляет наружу.
   Рисование и превью, и экспорт идут через одну функцию draw(),
   поэтому картинка на экране и в файле совпадают всегда.
   ============================================================ */

const THEMES = {
  dark: {
    name: 'Тёмная',
    bg1: '#171c22', bg2: '#0e1216',
    line: '#3d4855', text: '#e6ecf2', dim: '#8b949d',
    accent: '#d09a52', font: 'Georgia, "Times New Roman", serif',
    palette: ['#d09a52', '#6f93a8', '#a8806f', '#7f9a76', '#9b8bb4', '#b5806a']
  },
  light: {
    name: 'Светлая',
    bg1: '#f6f3ec', bg2: '#e8e3d8',
    line: '#b9b1a3', text: '#221f1a', dim: '#6d6659',
    accent: '#a4652a', font: 'Georgia, "Times New Roman", serif',
    palette: ['#a4652a', '#3f6076', '#7a4a3c', '#4d6b45', '#5f5378', '#8a5340']
  },
  sepia: {
    name: 'Сепия',
    bg1: '#221c14', bg2: '#110e09',
    line: '#4b4234', text: '#ece2cc', dim: '#948970',
    accent: '#d09a52', font: 'Georgia, "Times New Roman", serif',
    palette: ['#d09a52', '#9c8158', '#b08a63', '#7f7a5e', '#a8926d', '#8d7350']
  },
  school: {
    name: 'Школьная',
    bg1: '#ffffff', bg2: '#f2f5f8',
    line: '#9fb0c0', text: '#12202c', dim: '#5c6f80',
    accent: '#1f6feb', font: '"Segoe UI", Roboto, Arial, sans-serif',
    palette: ['#1f6feb', '#d1642a', '#2e8b57', '#8b4fa8', '#c0392b', '#0e7490']
  }
};

const state = {
  title: '', sub: '', foot: '',
  orient: 'h', size: [2560, 1440], theme: 'dark', scale: 'equal',
  events: [], sel: -1, step: 0
};

/* ---------- разбор дат ------------------------------------------------- */

const MONTHS = ['январ','феврал','март','апрел','ма','июн','июл','август',
                'сентябр','октябр','ноябр','декабр'];

// Возвращает число для сортировки и раскладки, либо null.
// Единица не важна: важно только, что все значения в одной шкале.
function parseWhen(raw) {
  const s = (raw || '').trim().toLowerCase();
  if (!s) return null;

  // 8:45 или 9:04:35 — время суток, в секундах
  let m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (m) return { kind: 'time', v: (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0)) };

  // 1917-12-06 или 1917-12
  m = s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
  if (m) return { kind: 'date', v: Date.UTC(+m[1], +m[2] - 1, +(m[3] || 1)) };

  // 6 декабря 1917
  m = s.match(/^(\d{1,2})\s+([а-яё]+)\s+(\d{3,4})/);
  if (m) {
    const mi = MONTHS.findIndex(p => m[2].startsWith(p));
    if (mi >= 0) return { kind: 'date', v: Date.UTC(+m[3], mi, +m[1]) };
  }

  // просто год: 1845, 2022
  m = s.match(/^(\d{3,4})$/);
  if (m) return { kind: 'date', v: Date.UTC(+m[1], 0, 1) };

  return null;
}

// Какая шкала возможна для текущего набора событий
function scaleInfo() {
  const parsed = state.events.map(e => parseWhen(e.when));
  const ok = parsed.filter(Boolean);
  if (!state.events.length) return { can: false, why: 'Добавьте события.' };
  if (ok.length < state.events.length) {
    return { can: false, why: 'Не все даты распознаны — шкала по времени недоступна. Понимаю: 1845, 1917-12-06, «6 декабря 1917», 9:04:35.' };
  }
  const kinds = new Set(ok.map(p => p.kind));
  if (kinds.size > 1) return { can: false, why: 'В списке смешаны даты и время суток. Шкала по времени недоступна.' };

  let values = ok.map(p => p.v);

  // Время суток без даты: 23:40 → 00:05 это не «назад на сутки», а полночь.
  // Раскручиваем в порядке списка, прибавляя сутки на каждом переходе.
  if (ok[0].kind === 'time') {
    let add = 0;
    const un = [values[0]];
    for (let i = 1; i < values.length; i++) {
      if (values[i] + add < un[i - 1]) add += 86400;
      un.push(values[i] + add);
    }
    values = un;
  }

  return { can: true, why: '', values };
}

/* ---------- раскладка -------------------------------------------------- */

// Возвращает массив позиций 0..1 вдоль линии
function positions() {
  const n = state.events.length;
  if (!n) return [];
  if (n === 1) return [0.5];

  const info = scaleInfo();
  if (state.scale === 'equal' || !info.can) {
    return state.events.map((_, i) => i / (n - 1));
  }

  let v = info.values.slice();

  if (state.scale === 'timebreak') {
    // Сжимаем промежутки, которые больше медианного втрое:
    // на длинной шкале иначе всё слипается в одну точку.
    const order = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]);
    const gaps = [];
    for (let i = 1; i < order.length; i++) gaps.push(order[i][0] - order[i - 1][0]);
    const sorted = gaps.slice().sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)] || 1;
    const cap = med * 3;
    let acc = order[0][0];
    const remap = new Map([[order[0][1], acc]]);
    for (let i = 1; i < order.length; i++) {
      acc += Math.min(order[i][0] - order[i - 1][0], cap);
      remap.set(order[i][1], acc);
    }
    v = v.map((_, i) => remap.get(i));
  }

  const lo = Math.min(...v), hi = Math.max(...v);
  if (hi === lo) return state.events.map((_, i) => i / (n - 1));
  return v.map(x => (x - lo) / (hi - lo));
}

/* ---------- рисование -------------------------------------------------- */

function wrap(ctx, text, maxW) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function groupColor(th, group) {
  if (!group) return th.accent;
  const groups = [...new Set(state.events.map(e => e.group).filter(Boolean))];
  const i = groups.indexOf(group);
  return th.palette[i % th.palette.length];
}

function draw(ctx, W, H, step) {
  const th = THEMES[state.theme];
  const k = Math.min(W, H) / 900;              // единый масштаб под любой размер
  // tk — масштаб текста подписей. Если в вертикальном кадре событий столько,
  // что колонка не влезает по высоте, текст ужимается, а не наезжает сам на себя.
  let tk = k;
  const F = (px) => `${Math.round(px * tk)}px ${th.font}`;
  const T = (px) => `${Math.round(px * k)}px ${th.font}`;   // заголовки, всегда в полный размер

  const g = ctx.createRadialGradient(W / 2, H * 0.44, 0, W / 2, H * 0.44, Math.max(W, H) * 0.8);
  g.addColorStop(0, th.bg1); g.addColorStop(1, th.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // заголовки
  let topPad = 60 * k;
  if (state.title) {
    ctx.fillStyle = th.text; ctx.font = T(44); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(state.title, W / 2, topPad);
    topPad += 58 * k;
  }
  if (state.sub) {
    ctx.fillStyle = th.dim; ctx.font = T(24);
    ctx.fillText(state.sub, W / 2, topPad);
    topPad += 40 * k;
  }
  if (state.foot) {
    ctx.fillStyle = th.dim; ctx.font = T(20); ctx.textAlign = 'center';
    ctx.fillText(state.foot, W / 2, H - 46 * k);
  }

  const pos = positions();
  const n = state.events.length;
  if (!n) {
    ctx.fillStyle = th.dim; ctx.font = T(26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Добавьте события слева', W / 2, H / 2);
    return;
  }

  const horiz = state.orient === 'h';
  const shown = Math.max(0, Math.min(step, n));

  // Горизонтальная лента: линия посередине, подписи по обе стороны.
  // Вертикальная: линия у левого края, подписи одной колонкой справа —
  // в кадре 9:16 на две стороны текста просто не хватает ширины.
  const m = horiz ? 150 * k : 90 * k;
  const from = horiz ? m : topPad + 60 * k;
  const to = horiz ? W - m : H - 110 * k;
  const at = (p) => from + p * (to - from);

  let lh26 = 34 * k, lh20 = 27 * k;
  const stem0 = (horiz ? 46 : 44) * k;
  const gapLane = 20 * k;

  // Меряем и раскладываем ВСЕ события, а рисуем только открытые.
  // Иначе от кадра к кадру подписи бы прыгали, и серия не склеилась бы в ролик.
  function measure(maxW) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const e = state.events[i];
      let w = 0;
      const wide = (s, f) => { ctx.font = f; w = Math.max(w, ctx.measureText(s).width); };

      wide(e.when || '', F(21));
      ctx.font = F(26);
      const tl = wrap(ctx, e.title, maxW);
      tl.forEach(s => wide(s, F(26)));
      ctx.font = F(20);
      const nl = e.note ? wrap(ctx, e.note, maxW) : [];
      nl.forEach(s => wide(s, F(20)));
      const gl = e.group ? '— ' + e.group : '';
      if (gl) wide(gl, F(18));

      // Крайние подписи прижимаем внутрь кадра: выноска остаётся у точки,
      // а текст сдвигается, чтобы не срезалось по краю.
      const p = at(pos[i]);
      const cx = horiz ? Math.min(Math.max(p, 40 * k + w / 2), W - 40 * k - w / 2) : p;

      out.push({
        e, tl, nl, gl, i, w, p, cx,
        h: 30 * tk + tl.length * lh26 + (nl.length ? 8 * tk + nl.length * lh20 : 0) + (gl ? 26 * tk : 0),
        col: groupColor(th, e.group)
      });
    }
    return out;
  }

  // Горизонталь: раскладка по дорожкам. На шкале «по времени» события
  // сбиваются в кучу, и простое чередование «сверху-снизу» кладёт подписи
  // одну на другую. Ищем первую свободную дорожку: своя сторона, чужая
  // сторона, второй ряд — и так далее.
  function assignLanes(items) {
    const busy = new Map();          // «сторона:ряд» → правый край занятого места
    let top = 0;
    for (const it of items) {
      const a = it.cx - it.w / 2 - 14 * k, b = it.cx + it.w / 2 + 14 * k;
      const pref = it.i % 2 === 0 ? -1 : 1;
      let done = false;
      for (let lvl = 0; lvl < 4 && !done; lvl++) {
        for (const side of [pref, -pref]) {
          const key = side + ':' + lvl;
          const last = busy.get(key);
          if (last === undefined || a > last) {
            it.side = side; it.level = lvl;
            busy.set(key, b);
            top = Math.max(top, lvl);
            done = true; break;
          }
        }
      }
      if (!done) { it.side = pref; it.level = 3; top = 3; }
    }
    return top;
  }

  // Вертикаль: подписи идут одной колонкой и просто расталкиваются вниз,
  // чтобы не наезжать друг на друга. Выноска остаётся у своей точки,
  // поэтому связь «точка — подпись» не теряется даже после сдвига.
  function stack(items, top, bot) {
    if (!items.length) return;
    let prev = -1e9;
    for (const it of items) {
      it.side = 1; it.level = 0;
      it.y = Math.max(it.p - it.h / 2, prev + gapLane, top);
      prev = it.y + it.h;
    }
    const overflow = prev - bot;
    if (overflow <= 0) return;

    // Не поместились: жмём всю колонку вверх, насколько позволяет заголовок.
    const shift = Math.min(overflow, Math.max(0, items[0].y - top));
    for (const it of items) it.y -= shift;
    if (overflow - shift <= 0) return;

    // И этого мало — раскладываем ровно, без привязки к масштабу времени.
    const totalH = items.reduce((s, it) => s + it.h, 0);
    const gap = Math.max(4 * k, (bot - top - totalH) / Math.max(1, items.length - 1));
    let y = top;
    for (const it of items) { it.y = y; y += it.h + gap; }
  }

  let items, axis, rowStep = 0;

  if (horiz) {
    const bandTop = topPad + 24 * k, bandBot = H - 76 * k;
    // Сколько места подписи занимают по каждую сторону от линии.
    const rows = (s) => {
      const lv = items.filter(it => it.side === s).map(it => it.level);
      return lv.length ? Math.max(...lv) + 1 : 0;
    };
    let up = 0, down = 0;

    // Подбираем размер текста: пока ряды подписей не влезают между
    // заголовком и нижней подписью — ужимаем.
    for (let pass = 0; pass < 10; pass++) {
      lh26 = 34 * tk; lh20 = 27 * tk;
      items = measure(Math.min(320 * k, (to - from) / Math.max(2, n) * 2.2));
      assignLanes(items);
      rowStep = items.length ? Math.max(...items.map(it => it.h)) + gapLane : 0;
      up = rows(-1) ? stem0 + rows(-1) * rowStep : 40 * k;
      down = rows(1) ? stem0 + rows(1) * rowStep : 40 * k;
      if (up + down <= bandBot - bandTop || tk <= k * 0.5) break;
      tk *= 0.9;
    }

    // Линия встаёт так, чтобы верхний ряд подписей не наехал на заголовок,
    // а нижний не ушёл под подпись внизу кадра.
    const lo = bandTop + up, hi = bandBot - down;
    axis = (lo + hi) / 2;
  } else {
    axis = m + 26 * k;
    const colTop = topPad + 24 * k;
    const colBot = H - 96 * k;
    const colW = W - axis - stem0 - 22 * k - m;

    // Подбираем размер текста: пока колонка не влезает по высоте — ужимаем.
    for (let pass = 0; pass < 10; pass++) {
      lh26 = 34 * tk; lh20 = 27 * tk;
      items = measure(colW);
      const need = items.reduce((s, it) => s + it.h, 0) + Math.max(0, items.length - 1) * gapLane;
      if (need <= colBot - colTop || tk <= k * 0.55) break;
      tk *= 0.92;
    }
    stack(items, colTop, colBot);
  }

  // ось: сплошная до последнего открытого события, дальше бледная,
  // чтобы кадр не «прыгал» по композиции от шага к шагу
  const endP = shown === 0 ? 0 : pos[shown - 1];
  ctx.strokeStyle = th.line; ctx.lineWidth = Math.max(2, 3 * k);
  ctx.beginPath();
  if (horiz) { ctx.moveTo(from, axis); ctx.lineTo(at(endP), axis); }
  else { ctx.moveTo(axis, from); ctx.lineTo(axis, at(endP)); }
  ctx.stroke();

  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  if (horiz) { ctx.moveTo(at(endP), axis); ctx.lineTo(to, axis); }
  else { ctx.moveTo(axis, at(endP)); ctx.lineTo(axis, to); }
  ctx.stroke();
  ctx.globalAlpha = 1;

  for (const it of items) {
    if (it.i >= shown) continue;
    const isLast = it.i === shown - 1;
    const off = stem0 + it.level * rowStep;

    // точка
    ctx.fillStyle = it.col;
    ctx.beginPath();
    ctx.arc(horiz ? it.p : axis, horiz ? axis : it.p, (isLast ? 13 : 9) * k, 0, 7);
    ctx.fill();
    if (isLast) {
      ctx.strokeStyle = it.col; ctx.globalAlpha = .45; ctx.lineWidth = 2.5 * k;
      ctx.beginPath(); ctx.arc(horiz ? it.p : axis, horiz ? axis : it.p, 26 * k, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // выноска
    ctx.strokeStyle = th.line; ctx.lineWidth = 2 * k;
    ctx.beginPath();
    if (horiz) {
      ctx.moveTo(it.p, axis + it.side * 16 * k);
      ctx.lineTo(it.p, axis + it.side * off);
    } else {
      // Подпись могла уехать вниз от своей точки — ведём линию наклонно,
      // чтобы было видно, к какой именно точке она относится.
      ctx.moveTo(axis + 16 * k, it.p);
      ctx.lineTo(axis + stem0, it.y + 15 * k);
    }
    ctx.stroke();

    // текст
    let x, cy;
    if (horiz) {
      x = it.cx;
      cy = it.side < 0 ? axis - off - it.h : axis + off;
      ctx.textAlign = 'center';
    } else {
      x = axis + stem0 + 22 * k;
      cy = it.y;
      ctx.textAlign = 'left';
    }
    ctx.textBaseline = 'top';

    ctx.fillStyle = it.col; ctx.font = F(21);
    ctx.fillText(it.e.when || '', x, cy);
    cy += 30 * tk;

    ctx.fillStyle = th.text; ctx.font = F(26);
    for (const ln of it.tl) { ctx.fillText(ln, x, cy); cy += lh26; }

    if (it.nl.length) {
      cy += 8 * tk;
      ctx.fillStyle = th.dim; ctx.font = F(20);
      for (const ln of it.nl) { ctx.fillText(ln, x, cy); cy += lh20; }
    }

    if (it.gl) {
      cy += 6 * tk;
      ctx.fillStyle = it.col; ctx.font = F(18);
      ctx.fillText(it.gl, x, cy);
    }
  }
}

/* ---------- превью ----------------------------------------------------- */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function render() {
  const [W, H] = state.size;
  const box = document.getElementById('stage').getBoundingClientRect();
  const fit = Math.min((box.width - 48) / W, (box.height - 48) / H, 1);
  cv.width = W; cv.height = H;
  cv.style.width = Math.round(W * fit) + 'px';
  cv.style.height = Math.round(H * fit) + 'px';
  draw(ctx, W, H, state.step);
}

/* ---------- интерфейс -------------------------------------------------- */

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderList() {
  const box = document.getElementById('events');
  if (!state.events.length) {
    box.innerHTML = '<div class="empty">Пока пусто. Нажмите «Добавить событие».</div>';
  } else {
    box.innerHTML = state.events.map((e, i) => `
      <div class="ev ${i === state.sel ? 'sel' : ''}" data-i="${i}">
        <div class="ev-top">
          <span class="ev-dot" style="background:${groupColor(THEMES[state.theme], e.group)}"></span>
          <span class="ev-when">${esc(e.when) || '—'}</span>
          <span class="ev-title">${esc(e.title) || 'Без названия'}</span>
        </div>
        <div class="ev-body">
          <div class="row tight">
            <div class="field"><label>Дата или время</label>
              <input data-f="when" value="${esc(e.when)}" placeholder="1917-12-06"></div>
            <div class="field"><label>Группа или человек</label>
              <input data-f="group" value="${esc(e.group)}" placeholder="необязательно"></div>
          </div>
          <div class="field"><label>Событие</label>
            <input data-f="title" value="${esc(e.title)}"></div>
          <div class="field"><label>Пояснение</label>
            <textarea data-f="note">${esc(e.note)}</textarea></div>
          <div class="ev-actions">
            <button class="small ghost" data-a="up">Выше</button>
            <button class="small ghost" data-a="down">Ниже</button>
            <button class="small ghost" data-a="dup">Копия</button>
            <button class="small ghost" data-a="del" style="color:var(--danger)">Удалить</button>
          </div>
        </div>
      </div>`).join('');
  }

  const info = scaleInfo();
  const hint = document.getElementById('scaleHint');
  if (!state.events.length) hint.textContent = '';
  else if (info.can) hint.innerHTML = 'Даты распознаны — доступны все шкалы.';
  else hint.innerHTML = '<span class="warn">' + esc(info.why) + '</span>';

  const st = document.getElementById('step');
  st.max = state.events.length;
  if (state.step > state.events.length) state.step = state.events.length;
  st.value = state.step;
  document.getElementById('stepLabel').textContent =
    `Кадр ${state.step} из ${state.events.length}`;
}

function refresh() { renderList(); render(); autosave(); }

document.getElementById('events').addEventListener('click', ev => {
  const card = ev.target.closest('.ev'); if (!card) return;
  const i = +card.dataset.i;
  const act = ev.target.dataset.a;
  if (act) {
    if (act === 'del') { state.events.splice(i, 1); state.sel = -1; }
    if (act === 'dup') { state.events.splice(i + 1, 0, Object.assign({}, state.events[i])); state.sel = i + 1; }
    if (act === 'up' && i > 0) { [state.events[i - 1], state.events[i]] = [state.events[i], state.events[i - 1]]; state.sel = i - 1; }
    if (act === 'down' && i < state.events.length - 1) { [state.events[i + 1], state.events[i]] = [state.events[i], state.events[i + 1]]; state.sel = i + 1; }
    state.step = state.events.length;
    refresh(); return;
  }
  state.sel = state.sel === i ? -1 : i;
  refresh();
});

document.getElementById('events').addEventListener('input', ev => {
  const card = ev.target.closest('.ev'); if (!card) return;
  const f = ev.target.dataset.f; if (!f) return;
  state.events[+card.dataset.i][f] = ev.target.value;
  render(); autosave();
  if (f === 'when' || f === 'group') {
    const info = scaleInfo(); const hint = document.getElementById('scaleHint');
    hint.innerHTML = info.can ? 'Даты распознаны — доступны все шкалы.'
                              : '<span class="warn">' + esc(info.why) + '</span>';
  }
});

document.getElementById('addEv').onclick = () => {
  state.events.push({ when: '', title: '', note: '', group: '' });
  state.sel = state.events.length - 1;
  state.step = state.events.length;
  refresh();
};

document.getElementById('sortEv').onclick = () => {
  const info = scaleInfo();
  if (!info.can) { toast('Сортировать нечего: даты не распознаны'); return; }
  const pairs = state.events.map((e, i) => [info.values[i], e]);
  pairs.sort((a, b) => a[0] - b[0]);
  state.events = pairs.map(p => p[1]);
  state.sel = -1;
  refresh();
  toast('События упорядочены по дате');
};

for (const [id, key] of [['pTitle', 'title'], ['pSub', 'sub'], ['pFoot', 'foot']]) {
  document.getElementById(id).addEventListener('input', e => {
    state[key] = e.target.value; render(); autosave();
  });
}

document.getElementById('orient').onchange = e => { state.orient = e.target.value; render(); autosave(); };
document.getElementById('scale').onchange = e => { state.scale = e.target.value; render(); autosave(); };
document.getElementById('size').onchange = e => {
  state.size = e.target.value.split('x').map(Number); render(); autosave();
};

const themeSel = document.getElementById('theme');
themeSel.innerHTML = Object.entries(THEMES).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join('');
themeSel.onchange = e => { state.theme = e.target.value; refresh(); };

const stepEl = document.getElementById('step');
stepEl.oninput = e => {
  state.step = +e.target.value;
  document.getElementById('stepLabel').textContent = `Кадр ${state.step} из ${state.events.length}`;
  render();
};
document.getElementById('playAll').onclick = () => {
  state.step = state.events.length; stepEl.value = state.step; refresh();
};

/* ---------- сохранение и экспорт --------------------------------------- */

// Имена файлов пишем латиницей: серию кадров потом скармливают ffmpeg
// по шаблону вида timeline-%02d.png, и кириллица там только мешает.
const TRANSLIT = {
  а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z',
  и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r',
  с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch',
  ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya'
};

function slug() {
  const s = (state.title || 'timeline').toLowerCase()
    .replace(/[а-яё]/g, c => TRANSLIT[c] != null ? TRANSLIT[c] : c)
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 50);
  return s || 'timeline';
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

document.getElementById('save').onclick = () => {
  const data = JSON.stringify({
    v: 1, title: state.title, sub: state.sub, foot: state.foot,
    orient: state.orient, size: state.size, theme: state.theme,
    scale: state.scale, events: state.events
  }, null, 2);
  download(new Blob([data], { type: 'application/json' }), slug() + '.json');
  toast('Проект сохранён');
};

document.getElementById('load').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { applyProject(JSON.parse(r.result)); toast('Проект открыт'); }
    catch (err) { toast('Не удалось прочитать файл: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
};

function applyProject(p) {
  state.title = p.title || ''; state.sub = p.sub || ''; state.foot = p.foot || '';
  state.orient = p.orient || 'h';
  state.size = Array.isArray(p.size) ? p.size : [2560, 1440];
  state.theme = THEMES[p.theme] ? p.theme : 'dark';
  state.scale = p.scale || 'equal';
  state.events = Array.isArray(p.events) ? p.events.map(e => ({
    when: e.when || '', title: e.title || '', note: e.note || '', group: e.group || ''
  })) : [];
  state.sel = -1; state.step = state.events.length;
  syncControls(); refresh();
}

function syncControls() {
  document.getElementById('pTitle').value = state.title;
  document.getElementById('pSub').value = state.sub;
  document.getElementById('pFoot').value = state.foot;
  document.getElementById('orient').value = state.orient;
  document.getElementById('size').value = state.size.join('x');
  document.getElementById('theme').value = state.theme;
  document.getElementById('scale').value = state.scale;
}

function frameBlob(step) {
  const [W, H] = state.size;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  draw(c.getContext('2d'), W, H, step);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

document.getElementById('exportOne').onclick = async () => {
  const b = await frameBlob(state.step);
  download(b, `${slug()}-${String(state.step).padStart(2, '0')}.png`);
  toast('Кадр сохранён');
};

document.getElementById('exportAll').onclick = async () => {
  const n = state.events.length;
  if (!n) { toast('Сначала добавьте события'); return; }
  const btn = document.getElementById('exportAll');
  btn.disabled = true;
  // Первый кадр — пустая линия, дальше по одному событию.
  // Кадры выгружаются по одному: браузер может спросить разрешение
  // на несколько файлов подряд — это нормально, надо согласиться.
  for (let s = 0; s <= n; s++) {
    const b = await frameBlob(s);
    download(b, `${slug()}-${String(s).padStart(2, '0')}.png`);
    await new Promise(r => setTimeout(r, 320));
  }
  btn.disabled = false;
  toast(`Готово: ${n + 1} кадров. Если скачался только первый — разрешите сайту несколько файлов.`);
};

/* ---------- автосохранение --------------------------------------------- */

const KEY = 'chronolenta.autosave';
function autosave() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      title: state.title, sub: state.sub, foot: state.foot,
      orient: state.orient, size: state.size, theme: state.theme,
      scale: state.scale, events: state.events
    }));
  } catch (e) { /* приватный режим — не беда */ }
}

function boot() {
  let restored = false;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { applyProject(JSON.parse(raw)); restored = true; }
  } catch (e) { /* ignore */ }

  if (!restored) {
    state.title = 'Ночь на 15 апреля 1912 года';
    state.sub = 'от удара об айсберг до последней шлюпки';
    state.foot = 'Хронолента';
    state.events = [
      { when: '23:40', title: 'Удар об айсберг', note: 'Пробоина по правому борту, пять отсеков', group: '«Титаник»' },
      { when: '00:05', title: 'Приказ готовить шлюпки', note: 'Мест хватает примерно половине людей на борту', group: '«Титаник»' },
      { when: '00:45', title: 'Первая шлюпка и первая ракета', note: 'Ракета белая — цвет не означает бедствия', group: '«Титаник»' },
      { when: '01:40', title: 'Восьмая, последняя ракета', note: '', group: '«Титаник»' },
      { when: '02:20', title: 'Судно уходит под воду', note: '', group: '«Титаник»' },
      { when: '04:00', title: '«Карпатия» подбирает первых', note: '58 миль за три с половиной часа', group: '«Карпатия»' }
    ];
    state.scale = 'time';
    state.step = state.events.length;
    syncControls();
  }
  refresh();
}

window.addEventListener('resize', render);
boot();
</script>
</html>
